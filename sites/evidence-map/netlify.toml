# Standalone Netlify site for the market-predictability evidence network.
#
# public/index.html is the whole app: one self-contained, dependency-free file,
# no build step, no functions, no env vars. It is generated by
# reference/market-predictability-evidence/bake_evidence_network.py; never
# hand-edit it.
#
# Only public/ is published — this README and netlify.toml stay unpublished on
# purpose, since the README names the private upstream repo and the pilot.
#
# Deployed MANUALLY, never from git — see scripts/deploy-evidence-map.sh. This
# site is deliberately separate from the Connected Capital pilot site so a
# deploy here can never touch the pilot.

[build]
  publish = "public"
  command = ""

# No build environment needed — nothing is compiled.

[[headers]]
  for = "/*"
  [headers.values]
    # The page loads zero external resources, so lock it down to exactly that:
    # no third-party scripts, frames, or fetches can be introduced by accident.
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    # Research data, not a product surface — keep it out of search results.
    X-Robots-Tag = "noindex, nofollow"

# index.html is regenerated on every data correction, so never let a browser
# serve a cached copy of a superseded verdict set.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Single-page app, single file: everything resolves to the map.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
