      --edge: rgba(255, 255, 255, 0.10);
      --node-ring: rgba(255, 255, 255, 0.40);
      --hub-fill: #262524;
      --accent: #3987e5;
      --chip-on: rgba(57, 135, 229, 0.16);

      --v-promising: #3987e5;
      --v-method: #9085e9;

    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --hairline: #2c2c2a;

    --node-ring: rgba(255, 255, 255, 0.40);

    --v-promising: #3987e5;
    --v-method: #9085e9;

    --r-pos: #199e70;
    --r-neg: #e66767;

    --s-ext: #6da7ec;

    --s-method: #9085e9;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 12px 18px 8px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 650; margin: 0; }
  header .counts { color: var(--text-secondary); font-size: 12.5px; }
  header .hint { color: var(--text-muted); font-size: 12px; margin-left: auto; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 4px 18px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 12.5px; padding: 5px 11px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--text-primary); font-weight: 600; }
  .seg-label { color: var(--text-muted); font-size: 12px; }

  .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    appearance: none; border: 1px solid var(--hairline); border-radius: 999px;
    background: transparent; color: var(--text-secondary); font: inherit; font-size: 12px;
    padding: 3.5px 10px 3.5px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--border); }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--text-primary); border-color: var(--accent); }
  .chip[aria-pressed="false"] { opacity: 0.55; }

  select, input[type="search"] {
    font: inherit; font-size: 12.5px; color: var(--text-primary);
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 5px 9px;
  }
  input[type="search"] { width: 190px; }
  .toolbar .reset {
    appearance: none; border: 0; background: transparent; color: var(--accent);
    font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px 4px;
  }

  main { position: relative; flex: 1; min-height: 0; }
  canvas#net { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas#net.dragging { cursor: grabbing; }
  canvas#net.pointing { cursor: pointer; }

  .legend {
    position: absolute; left: 14px; bottom: 14px; max-width: 250px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px;
    font-size: 11.5px; color: var(--text-secondary);
    backdrop-filter: blur(4px);
  }
  .legend h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 0 0 6px; font-weight: 600; }
  .legend .sec + .sec { margin-top: 9px; }
  .legend .row { display: flex; align-items: center; gap: 7px; margin: 2.5px 0; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--border); }
  .legend .dot.sm { width: 7px; height: 7px; }
  .legend .cnt { color: var(--text-muted); margin-left: auto; padding-left: 8px; }
  .legend .note { color: var(--text-muted); margin-top: 8px; border-top: 1px solid var(--hairline); padding-top: 7px; }
  .legend button.fold {
    position: absolute; top: 6px; right: 8px; appearance: none; border: 0; background: none;
    color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 2px;
  }
  .legend.folded .body { display: none; }
  .legend.folded { padding-bottom: 6px; }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 30; max-width: 320px;
    background: color-mix(in srgb, var(--panel) 97%, transparent);
    border: 1px solid var(--hairline); border-radius: 9px; padding: 8px 11px;
    font-size: 12px; color: var(--text-secondary);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    display: none;
  }
  #tooltip .t { color: var(--text-primary); font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
  #tooltip .pill { display: inline-block; border-radius: 999px; padding: 0.5px 7px; font-size: 11px; font-weight: 600; color: #fff; margin-right: 5px; }
  #tooltip .muted { color: var(--text-muted); }
  #tooltip .scores { margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

  aside#detail {
    position: absolute; top: 12px; right: 12px; bottom: 12px; width: 330px; z-index: 20;
    background: color-mix(in srgb, var(--panel) 96%, transparent);
    border: 1px solid var(--hairline); border-radius: 12px;
    padding: 14px 16px; overflow-y: auto; font-size: 13px; color: var(--text-secondary);
    backdrop-filter: blur(5px);
    display: none;
  }
  aside#detail.open { display: block; }
  #detail .close {
    position: absolute; top: 8px; right: 10px; appearance: none; border: 0; background: none;
    color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px;
  }
  #detail h2 { font-size: 15px; margin: 0 34px 6px 0; color: var(--text-primary); line-height: 1.3; }
  #detail .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 600; color: #fff; margin: 0 6px 6px 0; }
  #detail .pill.outline { color: var(--text-secondary); background: transparent; border: 1px solid var(--hairline); }
  #detail .kv { margin: 3px 0; }
  #detail .kv b { color: var(--text-primary); font-weight: 600; }
  #detail .scores { display: flex; gap: 5px; margin: 9px 0; }
  #detail .scores .s { flex: 1; text-align: center; border: 1px solid var(--hairline); border-radius: 7px; padding: 4px 0; }
  #detail .scores .s .k { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  #detail .scores .s .v { font-size: 14px; font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  #detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 13px 0 4px; font-weight: 600; }
  #detail p { margin: 4px 0; }
  #detail ul { margin: 4px 0; padding-left: 0; list-style: none; }
  #detail li { margin: 3px 0; }
  #detail a, #detail .link {
    color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: 0;
    font: inherit; padding: 0; text-align: left;
  }
  #detail a:hover, #detail .link:hover { text-decoration: underline; }
  #detail .li-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; box-shadow: inset 0 0 0 1px var(--border); }
</style>
</head>
<body>
<header>
  <h1>Market-predictability evidence network</h1>
  <span class="counts" id="counts"></span>
  <span class="hint">hover to inspect &middot; click to focus &middot; drag to pan &middot; scroll to zoom</span>
</header>

<div class="toolbar">
  <span class="seg-label">Layout</span>
  <div class="seg" id="layoutSeg" role="group" aria-label="Layout">
    <button data-v="force" aria-pressed="true">Force</button>
    <button data-v="layers" aria-pressed="false">Layers</button>
  </div>
  <span class="seg-label">Study color</span>
  <div class="seg" id="studyColorSeg" role="group" aria-label="Study color">
    <button data-v="result" aria-pressed="true">Result</button>
    <button data-v="stage" aria-pressed="false">Stage</button>
  </div>
  <span class="seg-label">Theme</span>
  <div class="seg" id="themeSeg" role="group" aria-label="Theme">
    <button data-v="auto" aria-pressed="true">Auto</button>
    <button data-v="light" aria-pressed="false">Light</button>
    <button data-v="dark" aria-pressed="false">Dark</button>
  </div>
  <select id="assetSel" aria-label="Asset class filter"></select>
  <div class="chips" id="verdictChips" aria-label="Verdict filters"></div>
  <div class="chips" id="stageChips" aria-label="Evidence-stage filters"></div>
  <input type="search" id="search" placeholder="Search families &amp; studies&hellip;" aria-label="Search">
  <button class="reset" id="resetBtn">Reset</button>
</div>

<main>
  <canvas id="net"></canvas>
  <div class="legend" id="legend">
    <button class="fold" id="legendFold" aria-label="Collapse legend">&#9662;</button>
    <h2>Legend</h2>
    <div class="body" id="legendBody"></div>
  </div>
  <div id="tooltip" role="tooltip"></div>
  <aside id="detail" aria-label="Node details"></aside>
</main>

firov (2024) re-examine 29 newer predictors and find the large majority fail out-of-sample, reaffirming the adverse baseline.","caveat":"Cheap and scalable, but incremental OOS value over buy-and-hold/historical mean is weak and unstable.","evidence":["goyal-welch-2008-equity-premium","campbell-thompson-2008-constrained-forecasts","rapach-strauss-zhou-2010-combination","ferreira-santa-clara-2011-sum-parts","neely-rapach-tu-zhou-2014-technical","dangl-halling-2012-time-varying","goyal-welch-zafirov-2024-equity-premium-update"]},{"id":"eq-value","label":"Equity value (book-to-market and related)","verdict":"Supported pre-live","confidence":"B","scores":{"p":3,"e":3,"r":4,"i":4,"t":3,"b":3},"tags":["equities"],"hub":"equities","target":"cross-sectional stock returns","horizon":"H3-H4 (monthly)","scope":"US and international equities, diversified long-short or long-only sleeves","summary":"Value organizes the cross-section across countries and long histories. Premia decay and droughts are material, but the theme remains among the more reproducible equity characteristics.","positive":"International and Bayesian global replications retain value as a broad theme under standardized construction.","negative":"Hou-Xue-Zhang show many related published variants fail conservative standardized tests; droughts and definition sensitivity remain.","caveat":"Production candidate as a patient diversified sleeve, not a standalone guarantee; crowding and definition choice matter.","evidence":["fama-french-1992-cross-section","fama-french-1998-international-value","asness-moskowitz-pedersen-2013-value-momentum","jensen-kelly-pedersen-2023-replication","chen-zimmermann-2022-open-source","hou-xue-zhang-2020-replicating-anomalies","novy-marx-velikov-2016-anomaly-costs"]},{"id":"eq-size","label":"Standalone equity size premium","verdict":"Ineffective in tested scope","confidence":"B","scores":{"p":1,"e":1,"r":2,"i":2,"t":1,"b":2},"tags":["equities"],"hub":"equities","target":"cross-sectional stock returns","horizon":"H3-H4","scope":"US and international stocks","summary":"Historical size effects concentrate in microcaps and illiquid names. After value-weighting, costs, and later samples, standalone size is weak.","positive":"Original Fama-French evidence and some size-related patterns in early samples.","negative":"Microcap dependence and trading costs remove most standalone value under conservative construction.","caveat":"Reject as a standalone premium; residual size exposure is usually a liquidity/microcap artifact.","evidence":["fama-french-1992-cross-section","fama-french-2015-five-factor","hou-xue-zhang-2020-replicating-anomalies","novy-marx-velikov-2016-anomaly-costs","green-hand-zhang-2017-independent-characteristics"]},{"id":"eq-low-risk","label":"Low-volatility / betting-against-beta / low-risk investing","verdict":"Not established","confidence":"C","scores":{"p":2,"e":1,"r":3,"i":2,"t":2,"b":2},"tags":["equities","cross-asset"],"hub":"equities","target":"cross-sectional risk-adjusted returns of low- vs high-risk stocks","horizon":"H3-H4 (monthly rebalanced cross-sectional sorts)","scope":"US and international single-stock universes; BAB extensions to Treasuries, credit, and futures","summary":"Low-beta and low-volatility stocks earn higher risk-adjusted returns than the CAPM predicts \u2014 a gross pattern reproduced across nine decades, 20+ markets, and several asset classes. External re-examination shows the flagship BAB construction leans on nano-cap rank-weighting, an artifact-prone beta estimator, and unmodeled costs, leaving a smaller value-weighted defensive premium with no significant net alpha over modern factor models.","positive":"Frazzini-Pedersen BAB earns 0.70%/month (t=7.12) over 1926-2012, significant in each 20-year subperiod, with positive Sharpe in 18 of 19 countries and analogous premia in Treasuries and credit; Baker-Bradley-Wurgler document the long-horizon low-volatility return gap.","negative":"Novy-Marx-Velikov (EXT s a conditionally unbiased volatility proxy and does not by itself establish that any forecast is economically useful.","pconf":"B","cited_by":["vol-rv-forecast"]},{"id":"DVM-2009-GOYAL-SARETTO-OPTION-RETURNS","title":"Cross-Section of Option Returns and Volatility","year":"2009","authors":"Amit Goyal; Alessio Saretto","venue":"Journal of Financial Economics 94(2): 310-326","url":"https://doi.org/10.1016/j.jfineco.2009.01.001","asset_class":"Single-stock equity options","tags":["equities","derivatives","volatility"],"hub":"equities","stage":"IS","result":"+?","native":"Return result: long high-HV-minus-IV and short low-HV-minus-IV option portfolios earn statistically significant monthly returns; with an assumed effective spread equal to the quoted spread, the long-short straddle return is 3.9% per month. Forecast-loss accuracy: not reported.","limitation":"Backtest selection, illiquidity concentration, assumed rather than realized execution, and short-option margin prevent a live-alpha interpretation.","pconf":"D","cited_by":["opt-xs-returns"]},{"id":"DVM-2013-CAO-HAN-IDIOVOL-OPTION-RETURNS","title":"Cross Section of Option Returns and Idiosyncratic Stock Volatility","year":"2013","authors":"Jie Cao; Bing Han","venue":"Journal of Financial Economics 108(1): 231-249","url":"https://ideas.repec.org/a/eee/jfinec/v108y2013i1p231-249.html","asset_class":"Single-stock equity options","tags":["equities","derivatives","volatility"],"hub":"equities","stage":"IS","result":"+?","native":"Return result: delta-hedged option returns decrease monotonically with underlying idiosyncratic volatility; limits-to-arbitrage controls reduce the relation by about 40%. Forecast-loss accuracy: not reported.","limitation":"Daily re-hedging creates substantial omitted stock and option trading costs.","pconf":"D","cited_by":["opt-xs-returns"]},{"id":"DVM-2022-ZHAN-HAN-CAO-TONG-OPTION-PREDICTABILITY","title":"Option Return Predictability","year":"2022","authors":"Xintong Zhan; Bing Han; Jie Cao; Qing Tong","venue":"Review of Financial Studies 35(3): 1394-1442","url":"https://ideas.repec.org/a/oup/rfinst/v35y2022i3p1394-1442..html","asset_class":"Single-stock equity options","tags":["equities","derivatives"],"hub":"equities","stage":"POOS","result":"+?","native":"Return result: several delta-hedged call-writing portfolios have annual Sharpe ratios above two and remain positive under the study's cost scenarios; equity factors do not explain them. Forecast-loss accuracy: not reported.","limitation":"The headline Sharpe ratios arise from retrospective characteristic selection and cost models rather than a frozen live portfolio.","pconf":"C","cited_by":["opt-xs-returns"]},{"id":"DVM-2025-ODONOVAN-YU-OPTION-COST-FAILURE","title":"A Transaction Cost Perspective on Option Anomalies","year":"2025","authors":"James O'Donovan; Yang Yu","venue":"Singapore Management University Lee Kong Chian School of Business Research Paper","url":"https://ink.library.smu.edu.sg/lkcsb_research/7872","asset_class":"Single-stock equity options","tags":["equities","derivatives"],"hub":"equities","stage":"EXT","result":"-","native":"Return result: 17 of 24 signals have positive significant gross returns, but none has positive significant cost-adjusted return under the paper's main cost assumptions; ex-post cost mitigation restores significance to seven. Forecast-loss accuracy: not reported.","limitation":"The mitigation rules are developed after observing the anomaly set and are not prospectively tested.","pconf":"D","cited_by":["opt-xs-returns"]},{"id":"katona-painter-patatoukas-zeng-2025-satellite-data","title":"On the Capital Market Consequences of Big Data: Evidence from Outer Space","year":"2025","authors":"Zsolt Katona; Marcus O. Painter; Panos N. Patatoukas; Jean Zeng","venue":"Journal of Financial and Quantitative Analysis 60(2): 551-579","url":"https://doi.org/10.1017/S0022109023001448","asset_class":"U.S. retail equities","tags":["equities","microstructure"],"hub":"equities","stage":"IS","result":"+?","native":"Parking-lot fill-rate changes predict quarterly retailer performance; the three-day good-minus-bad announcement-return spread is 4.76%, with stronger short-side effects after the paper's stock-loan-fee adjustment. Satellite coverage is associated with informed short selling and lower liquidity, not immediate price discovery.","limitation":"One proprietary 44-retailer panel, unequal data access, and retrospective strategy construction prevent a live or broadly scalable interpretation.","pconf":"D","cited_by":["alt-data"]},{"id":"bernard-thomas-1989-pead","title":"Post-Earnings-Announcement Drift: Delayed Price Response or Risk Premium?","year":"1989","authors":"Victor L. Bernard; Jacob K. Thomas","venue":"Journal of Accounting Research, Vol. 27 (Supplement: Current Studies on the Information Content of Accounting Earnings), pp. 1-36","url":"https://doi.org/10.2307/2491062","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"POOS","result":"++","native":"Stocks in the highest SUE decile drift up and lowest-decile stocks drift down by roughly 2% each over the 60 trading days after announcement; the combined long-short decile hedge earns about 4% per quarter (approximately 18% annualized before transaction costs) on 1974-86 NYSE/AMEX data. Drift is monotonic in SUE, inversely related to firm size, and positive-surprise firms out-return negative-surprise firms in almos\u2026","limitation":"The authors' own cost analysis implies the average-firm hedge return may sit inside round-trip transaction costs, so statistical drift does not establish net-of-cost profitability; the 1974-86 evaluation window became a repeatedly consulted test period, and the effect decayed sharply post-publication.","pconf":"C","cited_by":["eq-pead"]},{"id":"bernard-thomas-1990-pead-expectations","title":"Evidence that stock prices do not fully reflect the implications of current earnings for future earnings","year":"1990","authors":"Victor L. Bernard; Jacob K. Thomas","venue":"Journal of Accounting and Economics","url":"https://doi.org/10.1016/0165-4101(90)90008-R","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"POOS","result":"++","native":"Long top / short bottom quarter-t SUE decile earns three-day [-2,0] size-adjusted abnormal returns around subsequent announcements of +1.32% (t=14.63) at t+1, +0.70% (t=8.46) at t+2, +0.04% (t=0.45) at t+3, and -0.66% (t=-7.86) at t+4, matching the mean firm-level autocorrelation pattern of seasonally differenced earnings (+0.34, +0.19, +0.06, -0.24 at lags 1-4); the t+1 hedge return is positive in all 13 sample yea\u2026","limitation":"Tests reuse the same repeatedly consulted 1974-1986 NYSE/AMEX sample in which the hypothesis was generated (Bernard-Thomas 1989), with survivorship from the 1987 CRSP listing requirement and magnitude predictions calibrated to autocorrelations estimated within the same evaluation period.","pconf":"C","cited_by":["eq-pead"]},{"id":"chordia-goyal-sadka-sadka-shivakumar-2009-pead-liquidity","title":"Liquidity and the Post-Earnings-Announcement Drift","year":"2009","authors":"Tarun Chordia; Amit Goyal; Gil Sadka; Ronnie Sadka; Lakshmanan Shivakumar","venue":"Financial Analysts Journal","url":"https://doi.org/10.2469/faj.v65.n4.3","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"IS","result":"+?","native":"Equal-weighted SUE 10-1 spread is 1.31%/month (FF3 alpha 1.42%, t=9.10); value-weighted only 0.42%. In 10x10 SUE-by-illiquidity sorts the value-weighted long-short earns 0.04%/month in the most liquid decile versus 2.43%/month in the most illiquid (FF3 alpha 2.44%, t=9.06; FF4 2.43%, t=9.69); Fama-MacBeth SUE-x-illiquidity interaction is positive (0.041, t=4.70). Net of transaction costs the most-illiquid spread fal\u2026","limitation":"Full-sample retrospective sorts on a long-mined anomaly with no holdout or forecasting design, and the economic verdict spans profitable to unprofitable depending on the cost model chosen (net most-illiquid spread from +1.07% to -0.98% per month after borrow costs), with cost estimates from short modern high-frequency windows extrapolated back to the 1970s-80s.","pconf":"D","cited_by":["eq-pead"]},{"id":"martineau-2022-pead-decay","title":"Rest in Peace Post-Earnings Announcement Drift","year":"2022","authors":"Charles Martineau","venue":"Critical Finance Review, 11(3-4), 613-646","url":"https://doi.org/10.1561/104.00000122","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"EXT","result":"-","native":"PEAD has largely disappeared: analyst-surprise rank no longer significantly predicts BHAR[2,60] after 2005 for all-but-microcap stocks (above the NYSE 20th percentile) and fails in 2016-2019 for microcaps; in the size-quintile analyst-surprise analysis, the only suggestive drift since 2011 is for microcaps at days 2-5 (beta approx. 0.001). Random-walk surprises stopped predicting BHAR[2,60] for all-but-microcap stoc\u2026","limitation":"Disappearance is inferred from statistically insignificant coefficients and near-unit unbiasedness slopes rather than formal equivalence tests; pre-1996 announcements lack precise timestamps (day 0 merges two trading days); the analyst-surprise sample requires I/B/E/S coverage, and the residual microcap random-walk drift shows the death of PEAD is scoped to well-covered, larger stocks.","pconf":"B","cited_by":["eq-pead"]},{"id":"ang-hodrick-xing-zhang-2006-idiosyncratic-vol","title":"The Cross-Section of Volatility and Expected Returns","year":"2006","authors":"Andrew Ang; Robert J. Hodrick; Yuhang Xing; Xiaoyan Zhang","venue":"The Journal of Finance","url":"https://doi.org/10.1111/j.1540-6261.2006.00836.x","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"IS","result":"+?","native":"Highest idiosyncratic-volatility quintile earns -0.02% per month; the value-weighted 5-1 spread is -1.06% per month (t=-3.10) with FF-3 alpha -1.31% (t=-7.00), surviving size, book-to-market, leverage, liquidity, volume, turnover, bid-ask spread, coskewness, momentum, and analyst-dispersion controls (weakest under dispersion: 5-1 alpha -0.39%, t=-2.09); high Delta-VIX-beta stocks earn a -1.04% monthly 5-1 spread (FF\u2026","limitation":"Full-sample predictive sorts with no chronological holdout, and the anomalous sign is sensitive in later work to weighting schemes, formation windows, and short-term reversal controls.","pconf":"D","cited_by":["eq-low-risk"]},{"id":"frazzini-pedersen-2014-bab","title":"Betting Against Beta","year":"2014","authors":"Andrea Frazzini; Lasse Heje Pedersen","venue":"Journal of Financial Economics 111(1): 1-25","url":"https://doi.org/10.1016/j.jfineco.2013.10.005","asset_class":"Multi-asset: equities, Treasury bonds, corporate credit, and futures/forwards (equity indices, country bonds, FX, commodities)","tags":["equities","rates","credit","fx","commodities","futures"],"hub":"equities","stage":"POOS","result":"++","native":"U.S. equity BAB 1926-Mar 2012: excess return 0.70%/month (t=7.12), CAPM alpha 0.73% (t=7.44), Fama-French 3-factor alpha 0.73% (t=7.39), 4-factor alpha 0.55% (t=5.59), 5-factor alpha 0.55% (t=4.09); annualized Sharpe 0.78 (about twice value, 40% above momentum), significantly positive in each of the four 20-year subperiods. Pooled international BAB alpha 0.28-0.64%/month (t=2.09-4.81); positive Sharpe in 18 of 19 co\u2026","limitation":"Gross-return evidence: leverage, shorting, financing, and monthly-turnover costs are entirely unmodeled, and the rank-weighted, beta-rescaled construction embeds a micro-cap tilt and relies on noisy ex-ante betas (realized beta of the factor is not zero), so the economic magnitude is sensitive to construction and implementation choices later shown to matter.","pconf":"C","cited_by":["eq-low-risk"]},{"id":"baker-bradley-wurgler-2011-low-risk","title":"Benchmarks as Limits to Arbitrage: Understanding the Low-Volatility Anomaly","year":"2011","authors":"Malcolm Baker; Brendan Bradley; Jeffrey Wurgler","venue":"Financial Analysts Journal 67(1): 40-54","url":"https://doi.org/10.2469/faj.v67.n1.4","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"POOS","result":"+?","native":"$1 in the lowest-volatility quintile of all CRSP stocks in Jan 1968 grew to $59.55 by Dec 2008 versus $0.58 in the highest-volatility quintile (a gain of $10.12 versus a >90% loss in real terms); low-beta $60.46 versus high-beta $3.77. All-stock volatility sorts: Sharpe 0.39 (low) versus -0.05 (high); annualized CAPM alpha +2.08%/yr (t=2.44) versus -8.73%/yr (t=-3.28). Long-only low-volatility information ratios are\u2026","limitation":"Gross-return retrospective sorts on a single, heavily reused U.S. sample with no formal cost or borrow modeling, and the proposed benchmarking/limits-to-arbitrage mechanism is only indirectly tested; all three authors were consultants to or employees of Acadian Asset Management, a manager of managed-volatility strategies (disclosed).","pconf":"C","cited_by":["eq-low-risk"]},{"id":"novy-marx-velikov-2022-bab-critique","title":"Betting against betting against beta","year":"2022","authors":"Robert Novy-Marx; Mihail Velikov","venue":"Journal of Financial Economics 143(1): 80-106","url":"https://doi.org/10.1016/j.jfineco.2021.05.023","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"EXT","result":"-","native":"Rank-weighting is a backdoor to equal-weighting: BAB is 99.6% correlated with an equal-weighted-sort version, and per dollar invested BAB commits $1.05 to the bottom 1% of market capitalization (net positions above $1.20 in the bottom 1.7%). Value-weighted BAB earns 56 bp/month (t=3.48) with Sharpe 0.49 vs 1.08 for BAB and an insignificant FF5 alpha of 24 bp/month (t=1.63). Turnover is 214.7%/year (121.1% in the sma\u2026","limitation":"A retrospective full-sample decomposition by a single team (with disclosed industry ties) on the same U.S. data as the original; implementability conclusions rest on spread-based cost estimates without market impact or borrow costs, and the critique targets one construction - it does not rule out a smaller value-weighted low-beta premium or settle whether that premium is distinct from profitability/investment exposu\u2026","pconf":"C","cited_by":["eq-low-risk"]},{"id":"goyal-welch-zafirov-2024-equity-premium-update","title":"A Comprehensive 2022 Look at the Empirical Performance of Equity Premium Prediction","year":"2024","authors":"Amit Goyal; Ivo Welch; Athanasse Zafirov","venue":"Review of Financial Studies 37(11): 3490-3557","url":"https://doi.org/10.1093/rfs/hhae044","asset_class":"Equities","tags":["equities"],"hub":"equities","stage":"EXT","result":"-","native":"Of 31 post-2008 predictor series (29 variables plus two July-June annual variants; one semiannual variable, skew, failed replication even in the authors' original sample), 13 have no in-sample predictive ability once data are extended to 2021, and 69% of the 29 variables see t-statistics deteriorate; simulations suggest this joint pattern is more consistent with all 29 having been spurious than with modest stable pr\u2026","limitation":"By the authors' own admission not a harsh independent test: extended samples reuse each paper's original discovery period plus only about 10 new years, giving low power against surviving predictors, and the annual survivors rest on few nonoverlapping observations.","pconf":"B","cited_by":["eq-aggregate-valuation-macro"]},{"id":"huang-li-wang-zhou-2020-tsmom-questioned","title":"Time series momentum: Is it there?","year":"2020","authors":"Dashan Huang; Jiangyuan Li; Liyao Wang; Guofu Zhou","venue":"Journal of Financial Economics 135(3): 774-794","url":"https://doi.org/10.1016/j.jfineco.2019.08.004","asset_class":"Cross-asset futures and FX forwards (commodities, equity indexes, government bonds, currencies)","tags":["fx","commodities","derivatives","cross-asset"],"hub":"fx","stage":"EXT","result":"-","native":"Asset-by-asset 12m-to-1m regressions: only 8 of 55 slopes significant at 10% (3 at 5%), average in-sample R2 0.39%; recursive 2000-2015 out-of-sample average R2_OS -0.67% with 45 of 55 assets negative and only 3 significant. MOP's pooled t-statistic replicates at 4.34 but is below 5% bootstrap critical values (wild 12.53, pairs 4.83; t falls to 3.37 with fixed effects, below the 3.93 pairs-bootstrap critical value).\u2026","limitation":"The paper's own simulations show TSM and TSH strategies are statistically indistinguishable whenever the true pooled slope is small (0.08 in the data; TSM only clearly dominates near 0.4), so failing to reject no-predictability with low-powered asset-level tests cannot rule out a weak but real trend effect \u2014 absence of reliable evidence, not evidence of absence.","pconf":"C","cited_by":["eq-ts-trend"]},{"id":"hurst-ooi-pedersen-2017-century-trend","title":"A Century of Evidence on Trend-Following Investing","year":"2017","authors":"Brian Hurst; Yao Hua Ooi; Lasse Heje Pedersen","venue":"Journal of Portfolio Management 44(1): 15-29 (Fall 2017)","url":"https://doi.org/10.3905/jpm.2017.44.1.015","asset_class":"Multi-asset futures and forwards (equity indices, government bonds, currencies, commodities)","tags":["multi-asset","equities","rates","fx","commodities"],"hub":"multi-asset","stage":"EXT","result":"++","native":"1880-2016 combined 1/3/12-month time-series momentum at 10% vol target: 18.0% annualized gross excess return, 11.0% net of estimated transaction costs, 7.3% net of costs and 2/20 fees; realized vol 9.7%; net-of-fee-and-cost Sharpe 0.76; full-sample correlation -0.01 to U.S. equities and -0.03 to U.S. 10Y bonds; positive net-of-fee returns in all 14 decade subperiods (weakest 1910-1919: 1.6% net, Sharpe 0.13; the mos\u2026","limitation":"All three authors are principals of AQR, which manages trend-following funds; the same lineage both discovered the rule and assembled the century-long test data, and pre-futures-era returns are simulated non-investable proxies, so the headline net-of-fee Sharpe is a modeled, conflicted backtest rather than auditable third-party evidence.","pconf":"B","cited_by":["eq-ts-trend"]},{"id":"canina-figlewski-1993-iv-information","title":"The Informational Content of Implied Volatility","year":"1993","authors":"Linda Canina; Stephen Figlewski","venue":"Review of Financial Studies","url":"https://doi.org/10.1093/rfs/5.3.659","asset_class":"Derivatives and volatility","tags":["options","volatility"],"hub":"options","stage":"IS","result":"-","native":"Implied volatility had virtually no correlation with subsequent realized volatility, in aggregate and across subsamples split by maturity and strike (authors' abstract); across CF's reported specifications the slopes in realized-on-implied regressions were roughly 0.14-0.22 (far below the unbiasedness value of 1), and in encompassing regressions the implied-volatility coefficient fell to about 0.04-0.08 and was neve\u2026","limitation":"Extreme overlap of consecutive observations (telescoping realized-volatility windows sampled daily) yields imprecise and potentially inconsistent regression estimates, and the sample is confined to the low-volatility pre-crash 1983-1987 regime, which later work shows drives the null result.","pconf":"D","cited_by":["vol-iv-info"]},{"id":"moreira-muir-2017-vol-managed","title":"Volatility-Managed Portfolios","year":"2017","authors":"Alan Moreira; Tyler Muir","venue":"Journal of Finance 72(4): 1611-1644","url":"https://doi.org/10.1111/jofi.12513","asset_class":"Equities (factor portfolios) plus FX carry","tags":["equities","fx"],"hub":"equities","stage":"IS","result":"++","native":"Volatility-managed market factor earns annualized alpha 4.86% (SE 1.56) with beta 0.61 and appraisal ratio 0.34, raising buy-and-hold Sharpe ~25% (0.42 to 0.51); momentum is largest at alpha 12.51% (appraisal 0.875); alphas positive for 9 of 10 factors (SMB -0.58, insignificant); volatility-timed mean-variance-efficient portfolios have appraisal ratios 0.33-0.91; implied mean-variance utility gain ~65% of lifetime u\u2026","limitation":"The headline evidence is a full-sample in-sample spanning-regression alpha of a lagged-signal rule \u2014 no recursive out-of-sample evaluation \u2014 and independent real-time and cost-inclusive replications find the Sharpe/utility gains largely unattainable outside momentum and the cost-mitigated market factor.","pconf":"D","cited_by":["vol-rv-forecast"]},{"id":"cederburg-odoherty-wang-yan-2020-vol-managed-oos","title":"On the Performance of Volatility-Managed Portfolios","year":"2020","authors":"Scott Cederburg; Michael S. O'Doherty; Feifei Wang; Xuemin (Sterling) Yan","venue":"Journal of Financial Economics 138(1): 95-117","url":"https://doi.org/10.1016/j.jfineco.2020.04.015","asset_class":"Equities\u2014factor and anomaly portfolios","tags":["equities","volatility"],"hub":"equities","stage":"EXT","result":"-","native":"Direct comparisons: volatility-managed versions beat their originals in only 53 of 103 strategies (8 significant at 5%, concentrated in momentum; equal-outperformance null not rejected, binomial p=0.84, while a 100,000-sample bootstrap rejects the persistence-without-risk-return null at p=0.01). In-sample spanning alphas confirm Moreira-Muir (77 of 103 positive, 23 significant; managed-momentum alpha 12.39% per year\u2026","limitation":"The adverse verdict concerns the learnability of ex post combination weights under structural instability, not the existence of volatility predictability itself, and momentum, ROE, and betting-against-beta strategies retain significant real-time gains, so the negative claim covers the general recipe rather than every strategy.","pconf":"C","cited_by":["vol-rv-forecast"]}]}/*==GRAPH-DATA-END==*/
</script>

<script>
"use strict";
(function () {
  // ---------- data ----------
  var raw = document.getElementById("graph-data").textContent;
  var S_MARK = "/*==GRAPH-DATA-START==*/", E_MARK = "/*==GRAPH-DATA-END==*/";
  var DATA = null;
  try {
    DATA = JSON.parse(raw.slice(raw.indexOf(S_MARK) + S_MARK.length, raw.indexOf(E_MARK)));
  } catch (err) { /* fall through to the bake hint */ }
  if (!DATA || !DATA.families || !DATA.families.length) {
    document.getElementById("counts").textContent =
      "No graph data baked in — run: python3 bake_evidence_network.py";
    return;
  }

  var VERDICT_ORDER = ["Supported pre-live", "Promising", "Not established",
                       "Ineffective in tested scope", "Methodology — not rated"];
  var VERDICT_VAR = {
    "Supported pre-live": "--v-supported",
    "Promising": "--v-promising",
    "Not established": "--v-notest",
    "Ineffective in tested scope": "--v-ineffective",
    "Methodology — not rated": "--v-method"
  };
  var RESULT_ORDER = ["++", "+?", "-", "EQ", "H", "X", "NA"];
  var RESULT_VAR = { "++": "--r-pos", "+?": "--r-mixed", "-": "--r-neg", "EQ": "--r-neg",
                     "H": "--r-het", "X": "--r-invalid", "NA": "--r-na" };
  var RESULT_LABEL = {
    "++": "++ clear positive", "+?": "+? positive but imprecise", "-": "− adverse / benchmark wins",
    "EQ": "EQ effect ruled out", "H": "H unresolved heterogeneity", "X": "X invalid (leakage/flaw)",
    "NA": "NA not applicable"
  };
  var STAGE_ORDER = ["IS", "POOS", "HOLD", "EXT", "LIVE-P", "LIVE-X", "METHOD"];
  var STAGE_VAR = { "IS": "--s-is", "POOS": "--s-poos", "HOLD": "--s-hold", "EXT": "--s-ext",
                    "LIVE-P": "--s-livep", "LIVE-X": "--s-livex", "METHOD": "--s-method" };
  var STAGE_LABEL = {
    "IS": "IS in-sample", "POOS": "POOS pseudo out-of-sample", "HOLD": "HOLD true holdout",
    "EXT": "EXT external replication", "LIVE-P": "LIVE-P prospective/paper", "LIVE-X": "LIVE-X live execution",
    "METHOD": "METHOD methodology"
  };

  // ---------- graph model ----------
  var nodes = [], edges = [], byId = {};
  function addNode(n) { nodes.push(n); byId[n.id] = n; return n; }

  var rng = (function (seed) { // deterministic layout seed
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })(20260714);

  var hubs = DATA.hubs || [];
  hubs.forEach(function (h, i) {
    var a = (i / Math.max(1, hubs.length)) * Math.PI * 2 - Math.PI / 2;
    addNode({
      id: "hub:" + h.id, type: "hub", ref: h,
      r: 11 + Math.sqrt(h.families + 1) * 3.2,
      x: Math.cos(a) * 400, y: Math.sin(a) * 400, vx: 0, vy: 0
    });
  });

  (DATA.families || []).forEach(function (f) {
    var hub = byId["hub:" + f.hub];
    addNode({
      id: f.id, type: "family", ref: f,
      r: 5.5 + Math.min(7, f.evidence.length * 0.75),
      x: (hub ? hub.x : 0) + (rng() - 0.5) * 160,
      y: (hub ? hub.y : 0) + (rng() - 0.5) * 160, vx: 0, vy: 0
    });
    if (hub) edges.push({ a: hub, b: byId[f.id], kind: "hub" });
  });

  (DATA.studies || []).forEach(function (s) {
    var cites = s.cited_by.length;
    var anchor = cites ? byId[s.cited_by[0]] : byId["hub:" + s.hub];
    addNode({
      id: s.id, type: "study", ref: s,
      r: cites > 1 ? Math.min(8, 3.4 + (cites - 1) * 1.7) : (cites ? 3.4 : 3),
      multi: cites > 1, orphan: !cites,
      x: (anchor ? anchor.x : 0) + (rng() - 0.5) * 90,
      y: (anchor ? anchor.y : 0) + (rng() - 0.5) * 90, vx: 0, vy: 0
    });
    var sn = byId[s.id];
    s.cited_by.forEach(function (fid) {
      if (byId[fid]) edges.push({ a: byId[fid], b: sn, kind: "ev", multi: cites > 1 });
    });
    if (!cites && byId["hub:" + s.hub]) edges.push({ a: byId["hub:" + s.hub], b: sn, kind: "orphan" });
  });

  nodes.forEach(function (n) { n.nbr = new Set(); });
  edges.forEach(function (e) { e.a.nbr.add(e.b); e.b.nbr.add(e.a); });

  document.getElementById("counts").textContent =
    DATA.meta ? (DATA.meta.families + " claim families · " + DATA.meta.studies +
      " studies · " + DATA.meta.links + " evidence links · " +
      DATA.meta.multi_cited + " shared studies") : "";

  // ---------- theme & palette ----------
  var PAL = {};
  function readPalette() {
    var cs = getComputedStyle(document.documentElement);
    function v(name) { return cs.getPropertyValue(name).trim(); }
    PAL.surface = v("--surface"); PAL.textSecondary = v("--text-secondary");
    PAL.textMuted = v("--text-muted"); PAL.edge = v("--edge"); PAL.ring = v("--node-ring");
    PAL.hubFill = v("--hub-fill"); PAL.hairline = v("--hairline"); PAL.accent = v("--accent");
    PAL.verdict = {}; VERDICT_ORDER.forEach(function (k) { PAL.verdict[k] = v(VERDICT_VAR[k]); });
    PAL.result = {}; RESULT_ORDER.forEach(function (k) { PAL.result[k] = v(RESULT_VAR[k]); });
    PAL.stage = {}; STAGE_ORDER.forEach(function (k) { PAL.stage[k] = v(STAGE_VAR[k]); });
  }
  function colorFor(node) {
    if (node.type === "family") return PAL.verdict[node.ref.verdict] || PAL.verdict["Methodology — not rated"];
    if (node.type === "study") {
      return state.studyColor === "stage"
        ? (PAL.stage[node.ref.stage] || PAL.stage.METHOD)
        : (PAL.result[node.ref.result] || PAL.result.NA);
    }
    return PAL.hubFill;
  }

  // ---------- state ----------
  var state = {
    layout: "force", studyColor: "result", theme: "auto",
    verdicts: new Set(VERDICT_ORDER), stages: new Set(STAGE_ORDER),
    asset: "all", q: "",
    hover: null, selected: null
  };

  // ---------- canvas & camera ----------
  var canvas = document.getElementById("net"), ctx = canvas.getContext("2d");
  var cam = { x: 0, y: 0, k: 1 };     // world->screen: s = (w - cam.xy) * k + view/2
  var view = { w: 0, h: 0, dpr: 1 };
  function resize() {
    var r = canvas.getBoundingClientRect();
    view.w = r.width; view.h = r.height;
    view.dpr = Math.min(2.5, window.devicePixelRatio || 1);
    canvas.width = Math.round(r.width * view.dpr);
    canvas.height = Math.round(r.height * view.dpr);
    needsDraw = true;
  }
  window.addEventListener("resize", resize);

  function toScreen(x, y) { return [(x - cam.x) * cam.k + view.w / 2, (y - cam.y) * cam.k + view.h / 2]; }
  function toWorld(sx, sy) { return [(sx - view.w / 2) / cam.k + cam.x, (sy - view.h / 2) / cam.k + cam.y]; }

  function fitCamera(pad) {
    var vis = nodes.filter(function (n) { return !n.hidden; });
    if (!vis.length) return;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    vis.forEach(function (n) {
      var tx = n.tx != null ? n.tx : n.x, ty = n.ty != null ? n.ty : n.y;
      x0 = Math.min(x0, tx); x1 = Math.max(x1, tx);
      y0 = Math.min(y0, ty); y1 = Math.max(y1, ty);
    });
    var w = Math.max(80, x1 - x0), h = Math.max(80, y1 - y0);
    cam.k = Math.max(0.25, Math.min(1.6, Math.min((view.w - pad) / w, (view.h - pad) / h)));
    cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2;
  }

  // ---------- force simulation ----------
  var alpha = 0;
  function reheat(a) { alpha = Math.max(alpha, a); needsDraw = true; }
  function simTick() {
    var i, j, n, m, e, dx, dy, d2, d, f;
    // repulsion + collision (n ~ 244, O(n^2) is fine)
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i]; if (n.hidden) continue;
      for (j = i + 1; j < nodes.length; j++) {
        m = nodes[j]; if (m.hidden) continue;
        dx = n.x - m.x; dy = n.y - m.y;
        d2 = dx * dx + dy * dy;
        if (d2 < 1e-4) { dx = (rng() - 0.5); dy = (rng() - 0.5); d2 = dx * dx + dy * dy; }
        if (d2 > 240 * 240) continue;
        d = Math.sqrt(d2);
        f = (n.r * m.r * 2.4) / d2 * alpha;
        var minD = n.r + m.r + 3;
        if (d < minD) f += (minD - d) * 0.28 / d;
        n.vx += dx * f; n.vy += dy * f;
        m.vx -= dx * f; m.vy -= dy * f;
      }
    }
    // springs
    for (i = 0; i < edges.length; i++) {
      e = edges[i]; if (e.hidden) continue;
      var rest = e.kind === "ev" ? 55 : e.kind === "hub" ? 120 : 130;
      var k = e.kind === "ev" ? 0.05 : e.kind === "hub" ? 0.012 : 0.02;
      dx = e.b.x - e.a.x; dy = e.b.y - e.a.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      f = (d - rest) * k * alpha;
      dx /= d; dy /= d;
      e.a.vx += dx * f; e.a.vy += dy * f;
      e.b.vx -= dx * f; e.b.vy -= dy * f;
    }
    // gentle centering + integrate
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i]; if (n.hidden) continue;
      n.vx -= n.x * 0.004 * alpha; n.vy -= n.y * 0.004 * alpha;
      if (n === dragNode) { n.vx = 0; n.vy = 0; continue; }
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
    }
    alpha *= 0.985;
    if (alpha < 0.004) alpha = 0;
  }

  // ---------- layered ("neural network") layout ----------
  var tween = null; // {t0, dur, from:[{x,y}], to:[{x,y}]}
  var layeredCols = null;
  var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function layeredTargets() {
    var visH = hubs.map(function (h) { return byId["hub:" + h.id]; }).filter(function (n) { return !n.hidden; });
    var visF = nodes.filter(function (n) { return n.type === "family" && !n.hidden; });
    var visS = nodes.filter(function (n) { return n.type === "study" && !n.hidden; });

    var worldH = Math.max(view.h - 90, visS.length * 5.6, visF.length * 15);
    var colX = { hub: -view.w * 0.36, family: 0, study: view.w * 0.36 };
    layeredCols = colX; // captions must track the columns, not the live viewport
    var hubIdx = {}; hubs.forEach(function (h, i) { hubIdx[h.id] = i; });

    function spread(list, height) {
      var n = list.length;
      list.forEach(function (node, i) {
        node.ty = n <= 1 ? 0 : (i / (n - 1) - 0.5) * height;
      });
    }
    visH.sort(function (a, b) { return hubIdx[a.ref.id] - hubIdx[b.ref.id]; });
    visH.forEach(function (n) { n.tx = colX.hub; });
    spread(visH, Math.min(worldH, Math.max(220, visH.length * 64)));

    var vOrd = {}; VERDICT_ORDER.forEach(function (v, i) { vOrd[v] = i; });
    visF.sort(function (a, b) {
      return (hubIdx[a.ref.hub] - hubIdx[b.ref.hub]) ||
             ((vOrd[a.ref.verdict] || 0) - (vOrd[b.ref.verdict] || 0)) ||
             (a.ref.label < b.ref.label ? -1 : 1);
    });
    visF.forEach(function (n) { n.tx = colX.family; });
    spread(visF, Math.min(worldH, visF.length * 15.5));

    var famY = {}; visF.forEach(function (n) { famY[n.id] = n.ty; });
    var hubY = {}; visH.forEach(function (n) { hubY[n.ref.id] = n.ty; });
    visS.forEach(function (n) {
      var ys = n.ref.cited_by.map(function (fid) { return famY[fid]; })
        .filter(function (y) { return y != null; });
      n.sortY = ys.length ? ys.reduce(function (a, b) { return a + b; }, 0) / ys.length
                          : (hubY[n.ref.hub] != null ? hubY[n.ref.hub] : 0);
    });
    visS.sort(function (a, b) { return (a.sortY - b.sortY) || (a.id < b.id ? -1 : 1); });
    visS.forEach(function (n) { n.tx = colX.study; });
    spread(visS, Math.min(worldH, visS.length * 5.6));
  }

  function startTween() {
    layeredTargets();
    var movers = nodes.filter(function (n) { return !n.hidden && n.tx != null; });
    tween = {
      t0: performance.now(), dur: REDUCED ? 0 : 650,
      list: movers.map(function (n) { return { n: n, x0: n.x, y0: n.y }; })
    };
    needsDraw = true;
  }
  function stepTween(now) {
    if (!tween) return;
    var p = tween.dur ? Math.min(1, (now - tween.t0) / tween.dur) : 1;
    var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    tween.list.forEach(function (it) {
      it.n.x = it.x0 + (it.n.tx - it.x0) * e;
      it.n.y = it.y0 + (it.n.ty - it.y0) * e;
      it.n.vx = 0; it.n.vy = 0;
    });
    needsDraw = true;
    if (p >= 1) tween = null;
  }

  // ---------- visibility / filters ----------
  function applyFilters() {
    var asset = state.asset;
    nodes.forEach(function (n) {
      if (n.type === "family") {
        n.hidden = !state.verdicts.has(n.ref.verdict) ||
                   (asset !== "all" && n.ref.tags.indexOf(asset) === -1);
      } else if (n.type === "study") {
        n.hidden = !state.stages.has(n.ref.stage) ||
                   (asset !== "all" && n.ref.tags.indexOf(asset) === -1);
      }
    });
    nodes.forEach(function (n) {
      if (n.type !== "hub") return;
      if (asset !== "all") { n.hidden = n.ref.id !== asset; return; }
      var any = false;
      n.nbr.forEach(function (m) { if (!m.hidden) any = true; });
      n.hidden = !any;
    });
    edges.forEach(function (e) { e.hidden = e.a.hidden || e.b.hidden; });
    if (state.selected) select(state.selected.hidden ? null : state.selected); // re-render panel links
    if (state.hover && state.hover.hidden) { state.hover = null; showTooltip(null); }

    var nf = 0, ns = 0;
    nodes.forEach(function (n) {
      if (n.hidden) return;
      if (n.type === "family") nf++; else if (n.type === "study") ns++;
    });
    var meta = DATA.meta || { families: 0, studies: 0 };
    document.getElementById("counts").textContent =
      nf + " / " + meta.families + " families · " + ns + " / " + meta.studies +
      " studies · " + (DATA.meta ? DATA.meta.multi_cited + " shared studies" : "");

    if (state.layout === "layers") startTween(); else reheat(0.5);
    needsDraw = true;
  }

  function matchesSearch(n) {
    if (!state.q) return true;
    var q = state.q;
    if (n.type === "family")
      return (n.ref.label + " " + n.id).toLowerCase().indexOf(q) !== -1;
    if (n.type === "study")
      return (n.ref.title + " " + n.ref.authors + " " + n.id).toLowerCase().indexOf(q) !== -1;
    return n.ref.label.toLowerCase().indexOf(q) !== -1;
  }

  // ---------- rendering ----------
  var needsDraw = true;
  function hexA(hex, a) {
    if (hex[0] !== "#") return hex;
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function draw() {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = PAL.surface;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.setTransform(cam.k * view.dpr, 0, 0, cam.k * view.dpr,
      (view.w / 2 - cam.x * cam.k) * view.dpr, (view.h / 2 - cam.y * cam.k) * view.dpr);

    var focus = state.selected || state.hover;
    var hasSearch = !!state.q;
    var layered = state.layout === "layers";

    function nodeDim(n) {
      if (focus && n !== focus && !focus.nbr.has(n)) return true;
      if (hasSearch && !matchesSearch(n)) return true;
      return false;
    }

    // edges
    edges.forEach(function (e) {
      if (e.hidden) return;
      var inFocus = focus && (e.a === focus || e.b === focus);
      var dimmed = (focus && !inFocus) ||
                   (hasSearch && !matchesSearch(e.a) && !matchesSearch(e.b));
      var color, width;
      if (e.kind === "ev") {
        var vcol = PAL.verdict[e.a.ref.verdict] || PAL.textMuted;
        var baseA = e.multi ? 0.42 : 0.22;
        color = dimmed ? PAL.edge : hexA(vcol, inFocus ? 0.85 : baseA);
        width = (e.multi ? 1.7 : 1) * (inFocus ? 1.6 : 1);
      } else {
        color = dimmed ? PAL.edge : hexA(PAL.textMuted, inFocus ? 0.5 : (e.kind === "hub" ? 0.16 : 0.10));
        width = inFocus ? 1.3 : 0.8;
      }
      if (dimmed) { ctx.globalAlpha = 0.35; }
      ctx.strokeStyle = color;
      ctx.lineWidth = width / cam.k;
      ctx.beginPath();
      if (layered) {
        var mx = (e.a.x + e.b.x) / 2;
        ctx.moveTo(e.a.x, e.a.y);
        ctx.bezierCurveTo(mx, e.a.y, mx, e.b.y, e.b.x, e.b.y);
      } else {
        ctx.moveTo(e.a.x, e.a.y);
        ctx.lineTo(e.b.x, e.b.y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // nodes
    nodes.forEach(function (n) {
      if (n.hidden) return;
      var dim = nodeDim(n);
      ctx.globalAlpha = dim ? 0.16 : (n.orphan ? 0.75 : 1);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = colorFor(n);
      ctx.fill();
      ctx.lineWidth = (n.type === "hub" ? 1.2 : 0.9) / cam.k;
      ctx.strokeStyle = n.type === "hub" ? PAL.textMuted : PAL.ring;
      ctx.stroke();
      if (n === state.selected || n === state.hover) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 3.5 / cam.k, 0, Math.PI * 2);
        ctx.strokeStyle = PAL.accent;
        ctx.lineWidth = 2 / cam.k;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });

    // labels
    var px = function (s) { return s / cam.k; };
    ctx.textAlign = "center";
    nodes.forEach(function (n) {
      if (n.hidden) return;
      var dim = nodeDim(n);
      if (n.type === "hub") {
        ctx.globalAlpha = dim ? 0.25 : 1;
        ctx.fillStyle = PAL.textSecondary;
        ctx.font = "600 " + px(10.5) + "px system-ui, sans-serif";
        ctx.fillText(n.ref.label.toUpperCase(), n.x, n.y - n.r - px(5));
        ctx.globalAlpha = 1;
        return;
      }
      var focused = n === state.hover || n === state.selected || (focus && focus.nbr.has(n) && n.type === "family");
      if (n.type === "family" && (cam.k >= 1.05 || focused) && !dim) {
        ctx.fillStyle = PAL.textSecondary;
        ctx.font = px(9.5) + "px system-ui, sans-serif";
        var t = n.ref.label;
        if (t.length > 30) t = t.slice(0, 29) + "…";
        ctx.fillText(t, n.x, n.y - n.r - px(4));
      }
    });

    if (layered && layeredCols) {
      ctx.fillStyle = PAL.textMuted;
      ctx.font = "600 " + px(11) + "px system-ui, sans-serif";
      var y0 = 1e9;
      nodes.forEach(function (n) { if (!n.hidden) y0 = Math.min(y0, n.y - n.r); });
      if (y0 < 1e9) {
        ctx.fillText("ASSET CLASSES", layeredCols.hub, y0 - px(26));
        ctx.fillText("CLAIM FAMILIES", layeredCols.family, y0 - px(26));
        ctx.fillText("STUDIES", layeredCols.study, y0 - px(26));
      }
    }
  }

  // ---------- main loop ----------
  function frame(now) {
    stepTween(now);
    if (state.layout === "force" && alpha > 0 && !tween) { simTick(); needsDraw = true; }
    if (needsDraw) { draw(); needsDraw = false; }
    requestAnimationFrame(frame);
  }

  // ---------- interaction ----------
  var dragNode = null, panning = false, pStart = null, moved = false;

  function pick(sx, sy) {
    var w = toWorld(sx, sy), best = null, bestD = 1e9;
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      if (n.hidden) continue;
      var dx = n.x - w[0], dy = n.y - w[1];
      var d = Math.sqrt(dx * dx + dy * dy);
      var hit = Math.max(n.r + 2, 7 / cam.k);
      if (d < hit && d < bestD) { best = n; bestD = d; }
    }
    return best;
  }

  function endPointer() {
    canvas.classList.remove("dragging");
    dragNode = null; panning = false;
  }
  canvas.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0) return; // right/middle click: never start a drag
    endPointer();
    canvas.setPointerCapture(ev.pointerId);
    var n = pick(ev.offsetX, ev.offsetY);
    moved = false;
    if (n && state.layout === "force") { dragNode = n; reheat(0.35); }
    else { panning = true; }
    pStart = { x: ev.offsetX, y: ev.offsetY, cx: cam.x, cy: cam.y };
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("lostpointercapture", endPointer);
  canvas.addEventListener("pointermove", function (ev) {
    if (dragNode) {
      var w = toWorld(ev.offsetX, ev.offsetY);
      dragNode.x = w[0]; dragNode.y = w[1];
      moved = moved || Math.abs(ev.offsetX - pStart.x) + Math.abs(ev.offsetY - pStart.y) > 3;
      reheat(0.25);
      return;
    }
    if (panning) {
      cam.x = pStart.cx - (ev.offsetX - pStart.x) / cam.k;
      cam.y = pStart.cy - (ev.offsetY - pStart.y) / cam.k;
      moved = moved || Math.abs(ev.offsetX - pStart.x) + Math.abs(ev.offsetY - pStart.y) > 3;
      needsDraw = true;
      return;
    }
    var n = pick(ev.offsetX, ev.offsetY);
    if (n !== state.hover) { state.hover = n; needsDraw = true; }
    canvas.classList.toggle("pointing", !!n);
    showTooltip(n, ev.clientX, ev.clientY);
  });
  canvas.addEventListener("pointerup", function (ev) {
    var wasDrag = dragNode;
    endPointer();
    if (!moved) {
      var n = pick(ev.offsetX, ev.offsetY);
      select(n || null);
    } else if (wasDrag) { reheat(0.3); }
  });
  canvas.addEventListener("pointerleave", function () {
    state.hover = null; showTooltip(null); needsDraw = true;
  });
  canvas.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var f = Math.exp(-ev.deltaY * 0.0016);
    var k2 = Math.max(0.2, Math.min(5, cam.k * f));
    var w = toWorld(ev.offsetX, ev.offsetY);
    cam.x = w[0] - (ev.offsetX - view.w / 2) / k2;
    cam.y = w[1] - (ev.offsetY - view.h / 2) / k2;
    cam.k = k2;
    needsDraw = true;
  }, { passive: false });
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { select(null); showTooltip(null); }
  });

  // ---------- tooltip ----------
  var tip = document.getElementById("tooltip");
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function relLum(hex) {
    if (!hex || hex[0] !== "#" || hex.length < 7) return 0;
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function pill(text, hex) { // pick whichever ink has more contrast on this fill
    var L = relLum(hex);
    var ink = (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? "#0b0b0b" : "#ffffff";
    return '<span class="pill" style="background:' + hex + ";color:" + ink + '">' + esc(text) + "</span>";
  }
  function stageColor(s) { return PAL.stage[s.stage] || PAL.stage.METHOD; }
  function resultColor(s) { return PAL.result[s.result] || PAL.result.NA; }
  function showTooltip(n, cx, cy) {
    if (!n) { tip.style.display = "none"; return; }
    var h = "";
    if (n.type === "family") {
      var f = n.ref;
      h = '<div class="t">' + esc(f.label) + "</div>" +
        pill(f.verdict, colorFor(n)) +
        '<span class="muted">confidence ' + esc(f.confidence) + " · " +
        f.evidence.length + " studies</span>" +
        '<div class="scores muted">P ' + esc(f.scores.p) + " · E " + esc(f.scores.e) +
        " · R " + esc(f.scores.r) + " · I " + esc(f.scores.i) +
        " · T " + esc(f.scores.t) + " · B " + esc(f.scores.b) + "</div>";
    } else if (n.type === "study") {
      var s = n.ref;
      h = '<div class="t">' + esc(s.title) + "</div>" +
        '<div class="muted">' + esc(s.year) + " · " + esc(s.authors) + "</div>" +
        pill(s.stage, stageColor(s)) +
        pill("result " + s.result, resultColor(s)) +
        (s.cited_by.length > 1 ? '<span class="muted">shared by ' + s.cited_by.length + " families</span>" :
          (s.cited_by.length === 0 ? '<span class="muted">context (uncited)</span>' : ""));
    } else {
      h = '<div class="t">' + esc(n.ref.label) + "</div>" +
        '<div class="muted">' + n.ref.families + " families · " + n.ref.studies + " studies</div>";
    }
    tip.innerHTML = h;
    tip.style.display = "block";
    var mr = canvas.getBoundingClientRect();
    var x = cx - mr.left + 14, y = cy - mr.top + 12;
    tip.style.left = "0px"; tip.style.top = "0px";
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > view.w - 8) x = cx - mr.left - tw - 12;
    if (y + th > view.h - 8) y = cy - mr.top - th - 10;
    x = Math.max(8, x); y = Math.max(8, y);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

  // ---------- detail panel ----------
  var detail = document.getElementById("detail");
  function nodeLink(n, inner) { // filtered-out nodes are shown but not clickable
    if (n.hidden) return '<span style="color:var(--text-muted)">' + inner +
      ' <em>(filtered out)</em></span>';
    return '<button class="link" data-goto="' + esc(n.id) + '">' + inner + "</button>";
  }
  function select(n) {
    state.selected = n;
    needsDraw = true;
    if (!n) { detail.classList.remove("open"); detail.innerHTML = ""; return; }
    var h = '<button class="close" aria-label="Close">×</button>';
    if (n.type === "family") {
      var f = n.ref;
      h += "<h2>" + esc(f.label) + "</h2>" +
        pill(f.verdict, colorFor(n)) +
        '<span class="pill outline">confidence ' + esc(f.confidence) + "</span>" +
        '<div class="scores">' + ["p", "e", "r", "i", "t", "b"].map(function (k) {
          return '<div class="s"><div class="k">' + k + '</div><div class="v">' + esc(f.scores[k]) + "</div></div>";
        }).join("") + "</div>" +
        '<div class="kv"><b>Target:</b> ' + esc(f.target) + "</div>" +
        '<div class="kv"><b>Horizon:</b> ' + esc(f.horizon) + "</div>" +
        '<div class="kv"><b>Scope:</b> ' + esc(f.scope) + "</div>" +
        "<h3>Summary</h3><p>" + esc(f.summary) + "</p>" +
        (f.positive ? "<h3>Positive evidence</h3><p>" + esc(f.positive) + "</p>" : "") +
        (f.negative ? "<h3>Negative evidence</h3><p>" + esc(f.negative) + "</p>" : "") +
        (f.caveat ? "<h3>Key caveat</h3><p>" + esc(f.caveat) + "</p>" : "") +
        "<h3>Evidence (" + f.evidence.length + ")</h3><ul>" +
        f.evidence.map(function (sid) {
          var sn = byId[sid]; if (!sn) return "";
          var inner = esc(sn.ref.title.length > 60 ? sn.ref.title.slice(0, 59) + "…" : sn.ref.title) +
            ' <span style="color:var(--text-muted)">(' + esc(sn.ref.year) + ", " + esc(sn.ref.stage) + " " + esc(sn.ref.result) + ")</span>";
          return '<li><span class="li-dot" style="background:' + colorFor(sn) + '"></span>' +
            nodeLink(sn, inner) + "</li>";
        }).join("") + "</ul>";
    } else if (n.type === "study") {
      var s = n.ref;
      h += "<h2>" + esc(s.title) + "</h2>" +
        pill(s.stage, stageColor(s)) +
        pill("result " + s.result, resultColor(s)) +
        '<span class="pill outline">protocol conf. ' + esc(s.pconf) + "</span>" +
        '<div class="kv"><b>' + esc(s.year) + "</b> · " + esc(s.authors) + "</div>" +
        (s.venue ? '<div class="kv muted">' + esc(s.venue) + "</div>" : "") +
        '<div class="kv"><b>Asset class:</b> ' + esc(s.asset_class) + "</div>" +
        (s.native ? "<h3>Native result</h3><p>" + esc(s.native) + "</p>" : "") +
        (s.limitation ? "<h3>Key limitation</h3><p>" + esc(s.limitation) + "</p>" : "") +
        (/^https?:\/\//.test(s.url) ? '<p><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">Open paper ↗</a></p>' : "") +
        "<h3>Cited by " + s.cited_by.length + (s.cited_by.length === 1 ? " family" : " families") + "</h3><ul>" +
        s.cited_by.map(function (fid) {
          var fn = byId[fid]; if (!fn) return "";
          return '<li><span class="li-dot" style="background:' + colorFor(fn) + '"></span>' +
            nodeLink(fn, esc(fn.ref.label)) + "</li>";
        }).join("") + "</ul>" +
        (s.cited_by.length === 0 ? '<p class="muted">Context study — retained in the map but not cited by a family verdict.</p>' : "");
    } else {
      var hb = n.ref;
      h += "<h2>" + esc(hb.label) + "</h2>" +
        '<div class="kv">' + hb.families + " claim families · " + hb.studies + " studies tagged</div>" +
        "<h3>Families</h3><ul>" +
        nodes.filter(function (m) { return m.type === "family" && m.ref.hub === hb.id; })
          .map(function (fn) {
            return '<li><span class="li-dot" style="background:' + colorFor(fn) + '"></span>' +
              nodeLink(fn, esc(fn.ref.label)) + "</li>";
          }).join("") + "</ul>";
    }
    detail.innerHTML = h;
    detail.classList.add("open");
    detail.scrollTop = 0;
  }
  detail.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-goto]");
    if (t) {
      var n = byId[t.getAttribute("data-goto")];
      if (n && !n.hidden) {
        select(n);
        cam.x = n.x; cam.y = n.y;
        if (cam.k < 1) cam.k = 1.2;
        needsDraw = true;
      }
      return;
    }
    if (ev.target.closest(".close")) select(null);
  });

  // ---------- controls ----------
  function segWire(id, onChange) {
    var seg = document.getElementById(id);
    seg.addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      seg.querySelectorAll("button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      onChange(b.getAttribute("data-v"));
    });
  }
  segWire("layoutSeg", function (v) {
    state.layout = v;
    if (v === "layers") { startTween(); fitAfterTween(); }
    else { nodes.forEach(function (n) { n.tx = n.ty = null; }); tween = null; reheat(0.8); }
    needsDraw = true;
  });
  function fitAfterTween() {
    layeredTargets();
    fitCamera(70);
  }
  segWire("studyColorSeg", function (v) {
    state.studyColor = v; buildLegend(); needsDraw = true;
    if (state.selected) select(state.selected);
  });
  segWire("themeSeg", function (v) {
    state.theme = v;
    if (v === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    readPalette(); buildLegend(); needsDraw = true;
    if (state.selected) select(state.selected);
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if (state.theme === "auto") {
      readPalette(); buildLegend(); needsDraw = true;
      if (state.selected) select(state.selected);
    }
  });

  // asset select
  var assetSel = document.getElementById("assetSel");
  assetSel.innerHTML = '<option value="all">All asset classes</option>' +
    hubs.map(function (h) { return '<option value="' + esc(h.id) + '">' + esc(h.label) + "</option>"; }).join("");
  assetSel.addEventListener("change", function () { state.asset = assetSel.value; applyFilters(); });

  // chips
  function buildChips(elId, keys, activeSet, varOf, labelOf) {
    var el = document.getElementById(elId);
    el.innerHTML = "";
    keys.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "chip";
      b.setAttribute("aria-pressed", "true");
      b.innerHTML = '<span class="dot" style="background:var(' + varOf(k) + ')"></span>' + esc(labelOf(k));
      b.addEventListener("click", function () {
        if (activeSet.has(k)) activeSet.delete(k); else activeSet.add(k);
        b.setAttribute("aria-pressed", String(activeSet.has(k)));
        applyFilters();
      });
      el.appendChild(b);
    });
  }
  var presentVerdicts = VERDICT_ORDER.filter(function (v) {
    return (DATA.families || []).some(function (f) { return f.verdict === v; });
  });
  (DATA.families || []).forEach(function (f) { // never drop a non-canonical verdict
    if (presentVerdicts.indexOf(f.verdict) === -1) presentVerdicts.push(f.verdict);
  });
  state.verdicts = new Set(presentVerdicts);
  var presentStages = STAGE_ORDER.filter(function (s) {
    return (DATA.studies || []).some(function (st) { return st.stage === s; });
  });
  (DATA.studies || []).forEach(function (st) { // never drop a non-canonical stage
    if (presentStages.indexOf(st.stage) === -1) presentStages.push(st.stage);
  });
  state.stages = new Set(presentStages);
  function verdictVar(k) { return VERDICT_VAR[k] || "--v-method"; }
  function stageVar(k) { return STAGE_VAR[k] || "--s-method"; }
  buildChips("verdictChips", presentVerdicts, state.verdicts,
    verdictVar, function (k) { return k.replace(" in tested scope", ""); });
  buildChips("stageChips", presentStages, state.stages,
    stageVar, function (k) { return k; });

  // search
  var searchEl = document.getElementById("search");
  searchEl.addEventListener("input", function () {
    state.q = searchEl.value.trim().toLowerCase();
    needsDraw = true;
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    state.verdicts = new Set(presentVerdicts);
    state.stages = new Set(presentStages);
    state.asset = "all"; assetSel.value = "all";
    state.q = ""; searchEl.value = "";
    buildChips("verdictChips", presentVerdicts, state.verdicts,
      verdictVar, function (k) { return k.replace(" in tested scope", ""); });
    buildChips("stageChips", presentStages, state.stages,
      stageVar, function (k) { return k; });
    select(null);
    applyFilters();
    if (state.layout === "force") { fitCamera(60); reheat(0.6); }
  });

  // legend
  function buildLegend() {
    var el = document.getElementById("legendBody");
    var h = '<div class="sec"><h2>Families (verdict)</h2>';
    presentVerdicts.forEach(function (v) {
      var c = (DATA.families || []).filter(function (f) { return f.verdict === v; }).length;
      h += '<div class="row"><span class="dot" style="background:' + PAL.verdict[v] +
        '"></span>' + esc(v) + '<span class="cnt">' + c + "</span></div>";
    });
    h += "</div>";
    if (state.studyColor === "result") {
      h += '<div class="sec"><h2>Studies (result)</h2>';
      RESULT_ORDER.forEach(function (r) {
        if (r === "EQ" && !(DATA.studies || []).some(function (s) { return s.result === "EQ"; })) return;
        var c = (DATA.studies || []).filter(function (s) { return s.result === r; }).length;
        if (!c) return;
        h += '<div class="row"><span class="dot sm" style="background:' + PAL.result[r] +
          '"></span>' + esc(RESULT_LABEL[r]) + '<span class="cnt">' + c + "</span></div>";
      });
    } else {
      h += '<div class="sec"><h2>Studies (evidence stage)</h2>';
      STAGE_ORDER.forEach(function (s) {
        var c = (DATA.studies || []).filter(function (st) { return st.stage === s; }).length;
        if (!c) return;
        h += '<div class="row"><span class="dot sm" style="background:' + PAL.stage[s] +
          '"></span>' + esc(STAGE_LABEL[s]) + '<span class="cnt">' + c + "</span></div>";
      });
    }
    h += "</div>";
    h += '<div class="note">Node size = evidence links. Larger studies with thicker edges are cited by multiple families (connectors). Hollow-gray ring circles are asset-class hubs.</div>';
    el.innerHTML = h;
  }
  var legend = document.getElementById("legend");
  document.getElementById("legendFold").addEventListener("click", function () {
    legend.classList.toggle("folded");
    this.innerHTML = legend.classList.contains("folded") ? "&#9656;" : "&#9662;";
  });

  // ---------- boot ----------
  readPalette();
  buildLegend();
  resize();
  applyFilters();
  alpha = 1;
  for (var i = 0; i < 260; i++) simTick(); // settle before first paint
  alpha = 0.06;
  fitCamera(60);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
