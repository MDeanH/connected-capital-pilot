[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Landing page: the how-it-works explainer serves at the root (forced — the
# built React index.html exists at /, so this must shadow it)
[[redirects]]
  from = "/"
  to = "/how-it-works.html"
  status = 200
  force = true

# The React app lives at /app
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Diligence scoring engine (verified Monte Carlo, TS port)
[[redirects]]
  from = "/api/score"
  to = "/.netlify/functions/score"
  status = 200

# Grok / AI copilot proxy is a v2 function that self-routes via config.path
# (/api/grok/chat) with native per-IP rate limiting — no redirect needed here.

# Health / debug
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
