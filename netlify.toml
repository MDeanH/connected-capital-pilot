[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Diligence scoring engine (verified Monte Carlo, TS port)
[[redirects]]
  from = "/api/score"
  to = "/.netlify/functions/score"
  status = 200

# Grok / AI copilot proxy is a v2 function that self-routes via config.path
# (/api/grok/chat) with native per-IP rate limiting — no redirect needed here.

# Health / debug
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
